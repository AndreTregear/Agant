# ╔══════════════════════════════════════════════════════════════════╗
# ║  Oficina Digital — Authentik SSO Blueprint                      ║
# ║  Auto-configures OIDC providers for all services.               ║
# ║  Loaded on Authentik startup via /blueprints/ volume mount.     ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Authentik Blueprint API v1
# Docs: https://goauthentik.io/docs/developer-docs/blueprints/

version: 1
metadata:
  name: Oficina Digital SSO
  labels:
    oficina/managed: "true"

# ──────────────────────────────────────────────
# Certificate/Key pair for signing tokens
# ──────────────────────────────────────────────
entries:
  - model: authentik_crypto.certificatekeypair
    id: oficina-signing-key
    attrs:
      name: oficina-signing-keypair
      # Auto-generated self-signed cert on first import
    state: present
    conditions: []

  # ──────────────────────────────────────────────
  # Scopes (property mappings)
  # ──────────────────────────────────────────────
  - model: authentik_providers_oauth2.scopemapping
    id: scope-openid
    attrs:
      name: "OpenID Connect scope: openid"
      scope_name: openid
      expression: |
        return {
          "sub": request.user.uid,
        }
    state: present

  - model: authentik_providers_oauth2.scopemapping
    id: scope-email
    attrs:
      name: "OpenID Connect scope: email"
      scope_name: email
      expression: |
        return {
          "email": request.user.email,
          "email_verified": True,
        }
    state: present

  - model: authentik_providers_oauth2.scopemapping
    id: scope-profile
    attrs:
      name: "OpenID Connect scope: profile"
      scope_name: profile
      expression: |
        return {
          "name": request.user.name,
          "given_name": request.user.name.split(" ")[0] if request.user.name else "",
          "family_name": " ".join(request.user.name.split(" ")[1:]) if request.user.name else "",
          "preferred_username": request.user.username,
          "nickname": request.user.username,
          "groups": [group.name for group in request.user.ak_groups.all()],
        }
    state: present

  # ──────────────────────────────────────────────
  # Authorization flow
  # ──────────────────────────────────────────────
  - model: authentik_flows.flow
    id: oficina-authorize-flow
    attrs:
      name: Oficina Authorize
      title: Authorize Application
      slug: oficina-authorize
      designation: authorization
      authentication: require_authenticated
    state: present

  - model: authentik_stages_consent.consentstage
    id: oficina-consent-stage
    attrs:
      name: oficina-consent
      mode: permanent  # Remember consent per app
    state: present

  - model: authentik_flows.flowstagebinding
    id: oficina-authorize-binding
    attrs:
      target: !Find [authentik_flows.flow, [slug, oficina-authorize]]
      stage: !Find [authentik_stages_consent.consentstage, [name, oficina-consent]]
      order: 0
    state: present

  # ════════════════════════════════════════════════
  # OIDC PROVIDERS — one per service
  # ════════════════════════════════════════════════

  # ── agente-ceo (AI Portal) ──────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-agente-ceo
    identifiers:
      name: agente-ceo
    attrs:
      name: agente-ceo
      authorization_flow: !Find [authentik_flows.flow, [slug, oficina-authorize]]
      client_type: confidential
      client_id: !Env [AGENTE_CEO_OIDC_CLIENT_ID, agente-ceo-client]
      client_secret: !Env [AGENTE_CEO_OIDC_CLIENT_SECRET, change-me]
      redirect_uris: |
        https://!Env [DOMAIN, oficina.local]/api/auth/callback/authentik
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, oficina-signing-keypair]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
    state: present

  - model: authentik_core.application
    id: app-agente-ceo
    attrs:
      name: "AI Portal"
      slug: agente-ceo
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, agente-ceo]]
      meta_launch_url: "https://!Env [DOMAIN, oficina.local]"
      meta_icon: ""
      policy_engine_mode: any
    state: present

