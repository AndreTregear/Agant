  # ──────────────────────────────────────────────
  # Groups — role-based access
  # ──────────────────────────────────────────────
  - model: authentik_core.group
    id: group-admins
    attrs:
      name: oficina-admins
      is_superuser: true
    state: present

  - model: authentik_core.group
    id: group-managers
    attrs:
      name: oficina-managers
      is_superuser: false
    state: present

  - model: authentik_core.group
    id: group-employees
    attrs:
      name: oficina-employees
      is_superuser: false
    state: present

  # ──────────────────────────────────────────────
  # Embedded Outpost (for forward-auth / proxy)
  # ──────────────────────────────────────────────
  - model: authentik_outposts.outpost
    id: oficina-outpost
    identifiers:
      name: oficina-embedded-outpost
    attrs:
      name: oficina-embedded-outpost
      type: proxy
      protocol_providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, ragflow]]
      config:
        authentik_host: "https://auth.!Env [DOMAIN, oficina.local]"
        docker_network: oficina-net
    state: present
