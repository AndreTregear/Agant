  # ── RAGFlow (forward-auth outpost) ──────────
  - model: authentik_providers_proxy.proxyprovider
    id: provider-ragflow
    identifiers:
      name: ragflow
    attrs:
      name: ragflow
      authorization_flow: !Find [authentik_flows.flow, [slug, oficina-authorize]]
      mode: forward_single
      external_host: "https://docs.!Env [DOMAIN, oficina.local]"
    state: present

  - model: authentik_core.application
    id: app-ragflow
    attrs:
      name: "Documents AI"
      slug: ragflow
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, ragflow]]
      meta_launch_url: "https://docs.!Env [DOMAIN, oficina.local]"
