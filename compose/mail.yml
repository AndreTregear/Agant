# Stalwart Mail Server
# All-in-one: IMAP, JMAP, SMTP, CalDAV, CardDAV, WebDAV.
# Written in Rust — fast, low resource usage.

services:
  stalwart:
    image: stalwartlabs/stalwart:latest
    restart: unless-stopped
    environment:
      - STALWART_ADMIN_USER=${STALWART_ADMIN_USER:-admin}
      - STALWART_ADMIN_PASSWORD=${STALWART_ADMIN_PASSWORD:?STALWART_ADMIN_PASSWORD required}
    volumes:
      - ${DATA_DIR}/stalwart:/opt/stalwart
    ports:
      # SMTP
      - "25:25"
      - "587:587"
      # IMAP
      - "993:993"
      - "143:143"
      # HTTP (webmail + JMAP + admin)
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M
    networks:
      - oficina-net
    profiles:
      - mail
